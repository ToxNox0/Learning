<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kanban Board</h1>
    </header>
    <main>
        <div class="main-content">
            <div class="to-do content">
                <div class="heading">
                    <p>Work</p>
                    <button id="addToDo">Add</button>
                </div>
                <ul>
                    <li>
                    <label>
                            <input type="checkbox">
                            <span>Sleep more</span>
                    </label>
                    </li>
                </ul>
            </div>
            <div class="in-progress content">
                <button id="addProgress">Add</button>
            </div>
            <div class="completed content">
                <button id="addCompleted">Add</button>
            </div>
        </div>
    </main>
</body>
</html>
