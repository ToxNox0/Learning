<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="first.js" defer></script>
</head>
<body>
    <header>
        <h1>Kanban Board</h1>
    </header>
    <main>
        <div class="main-content">
            <div class="to-do content">
                <div class="heading">
                    <p>Work</p>
                    <input type="text" class="toDoInput" placeholder="Add an event">
                    <button class="addToDo">Add</button>
                </div>
                <ul class="toDoList">
                    <li>
                    <label>
                            <input type="checkbox">
                            <span>Sleep more</span>
                    </label>
                    </li>
                </ul>
            </div>
            <div class="in-progress content">
                <div class="heading">
                    <p>In Progress</p>
                    <input type="text" class="toDoInput" placeholder="Add an event">
                    <button class="addToDo">Add</button>
                </div>
                <ul class="toDoList">
                    <li>
                    <label>
                            
                    </label>
                    </li>
                </ul>
            </div>
            <div class="completed content">
                <div class="heading">
                    <p>Completed</p>
                    <input type="text" class="toDoInput" placeholder="Add an event">
                    <button class="addToDo">Add</button>
                </div>
                <ul class="toDoList">
                    <li>
                    <label>
                            
                    </label>
                    </li>
                </ul>
            </div>
        </div>
    </main>
</body>
</html>
